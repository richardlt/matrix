version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /emulator
      - /gamepad
    schedule:
      interval: monthly
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
