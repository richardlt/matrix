name: test
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest released patch. go.mod's `go` directive is the minimum supported
          # version, not the one to test against.
          go-version: 'stable'
      - run: make test-with-report
      - uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: 'report.xml'
          fail_on_failure: true
