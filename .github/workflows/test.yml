name: test
on: [push]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - run: make check

  # Vite never type-checks, so nothing else would reject a type error before release.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: (cd emulator && make install check build)
      - run: (cd gamepad && make install check build)

  # Catch a break in the release target on the branch rather than at tag time. This only
  # compiles for ARMv6: producing a shippable binary needs the ARM musl cross toolchain,
  # which is not an apt package, so the release artifacts are still built by hand.
  armv6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - run: make check-armv6

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest released patch. go.mod's `go` directive is the minimum supported
          # version, not the one to test against.
          go-version: 'stable'
      - run: make test-with-report
      - uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: 'report.xml'
          fail_on_failure: true
