name: ci
on: [push]

# Reading the tree is all any job below needs; the one that publishes its results asks for
# more where it runs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - run: make check

  # Vite never type-checks, so nothing else would reject a type error before release.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: (cd emulator && make install check build)
      - run: (cd gamepad && make install check build)

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Latest released patch. go.mod's `go` directive is the minimum supported
          # version, not the one to test against.
          go-version: 'stable'
      - run: make test

  # The same two artifacts a release ships, built on every push: a break in the cross
  # build or the packaging then shows up on the branch rather than at tag time, and any
  # commit can be written to a card without a toolchain on your own machine.
  package:
    runs-on: ubuntu-latest
    # On a tag the release builds the same thing and keeps it, so this would only be a
    # second copy thrown away. The checks and the tests above still run on the tag.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version the artifacts carry comes from `git describe`, which needs the
          # tags, and the default checkout fetches none of them.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - id: build
        uses: ./.github/actions/release-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: matrix-${{ steps.build.outputs.version }}
          path: |
            matrix.tar.gz
            target/*.deb
